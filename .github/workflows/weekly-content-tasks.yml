name: Crear y publicar contenido semanal

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:
    inputs:
      tema:
        description: Tema opcional para el próximo episodio
        required: false
        type: string

concurrency:
  group: weekly-content-tasks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create-content:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Crear un cuento sin servicios externos
        env:
          REQUESTED_THEME: ${{ inputs.tema }}
        run: node scripts/generate-weekly-story.mjs
      - name: Validar contenido y aplicación
        run: |
          npm run validate:content
          npm run validate:mini
          npm run build
      - name: Guardar en main y activar el despliegue
        shell: bash
        run: |
          git config user.name "tinkie-content-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/historias/
          if git diff --cached --quiet; then
            echo "No hay contenido nuevo que guardar."
            exit 0
          fi
          git commit -m "content: añadir cuento semanal automático"
          git push origin HEAD:main
