name: Crear contenido semanal con Copilot

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:
    inputs:
      tema:
        description: Tema opcional para el próximo episodio
        required: false
        type: string

concurrency:
  group: weekly-content-tasks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create-content:
    runs-on: ubuntu-latest
    steps:
      - name: Encargar historias y abrir una pull request
        env:
          COPILOT_TASK_TOKEN: ${{ secrets.COPILOT_TASK_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_THEME: ${{ inputs.tema }}
        shell: bash
        run: |
          if [ -z "$COPILOT_TASK_TOKEN" ]; then
            echo "Falta el secreto COPILOT_TASK_TOKEN." >&2
            exit 1
          fi

          prompt=$(cat <<'PROMPT'
          Lee y sigue `.github/agents/tinkie-historias.agent.md` y
          `.github/instructions/tinkie-comun.instructions.md`.

          Genera un nuevo episodio semanal para Tinkie dirigido a un lector
          de 11 años (nivel avanzado, 10-12). Lee primero el catálogo y los
          cuentos existentes para continuar una serie temática con coherencia,
          alternar géneros y evitar repetir tramas, valores o palabras clave.

          Cada episodio debe incluir `serie`, `episodio`, `genero`, `tema`,
          `sinopsis` y una `palabra_clave` con término, definición sencilla,
          uso cotidiano y ejemplo. Guarda el JSON en `content/historias/`,
          actualiza `content/historias/index.json` y ejecuta
          `npm run validate:content` y `npm run build`.

          Nunca publiques directamente ni modifiques datos de producción.

          Abre una pull request pendiente de revisión adulta. Al principio de
          su descripción incluye `## Resumen para la familia`: título, serie y
          episodio, género, edad, valor, palabra clave y un resumen de 2-3
          frases sin revelar el final. Después incluye `## Qué se añadirá` y
          `## Comprobaciones`. No mezcles la pull request.
          PROMPT
          )

          if [ -n "$REQUESTED_THEME" ]; then
            prompt="$prompt

          Tema solicitado manualmente: $REQUESTED_THEME"
          fi

          jq -n \
            --arg prompt "$prompt" \
            '{prompt: $prompt, base_ref: "main", create_pull_request: true}' \
            > request.json

          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Authorization: Bearer $COPILOT_TASK_TOKEN" \
            "https://api.github.com/agents/repos/$REPOSITORY/tasks" \
            --data-binary @request.json
