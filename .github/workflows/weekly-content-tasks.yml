name: Crear contenido semanal con Copilot

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

concurrency:
  group: weekly-content-tasks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create-content:
    runs-on: ubuntu-latest
    steps:
      - name: Encargar historias y abrir una pull request
        env:
          COPILOT_TASK_TOKEN: ${{ secrets.COPILOT_TASK_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          if [ -z "$COPILOT_TASK_TOKEN" ]; then
            echo "Falta el secreto COPILOT_TASK_TOKEN." >&2
            exit 1
          fi

          prompt=$(cat <<'PROMPT'
          Lee y sigue `.github/agents/tinkie-historias.agent.md` y
          `.github/instructions/tinkie-comun.instructions.md`.

          Genera tres historias nuevas para Tinkie: una inicial (4-6), una
          media (7-9) y una avanzada (10-12). Usa temas y valores diferentes,
          evita repetir historias existentes, guarda los JSON en
          `content/historias/` y actualiza `content/historias/index.json`.
          Valida todos los archivos y no publiques nada en Supabase.

          Abre una pull request pendiente de revisión adulta. Al principio de
          su descripción incluye `## Resumen para la familia` y, para cada
          cuento: título, edad, valor y un resumen de 2-3 frases sin revelar el
          final. Después incluye `## Qué se añadirá` y las comprobaciones
          realizadas. No mezcles la pull request.
          PROMPT
          )

          jq -n \
            --arg prompt "$prompt" \
            '{prompt: $prompt, base_ref: "main", create_pull_request: true}' \
            > request.json

          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Authorization: Bearer $COPILOT_TASK_TOKEN" \
            "https://api.github.com/agents/repos/$REPOSITORY/tasks" \
            --data-binary @request.json
