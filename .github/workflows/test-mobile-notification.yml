name: Probar notificación móvil

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Crear incidencia de prueba
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "🦜 Prueba de notificación de Tinkie" \
            --body "@$GITHUB_REPOSITORY_OWNER, esta incidencia comprueba que las alertas del proyecto llegan a GitHub Mobile.

          Si recibiste esta mención directa, la conexión funciona correctamente.

          > Creada manualmente desde el flujo **Probar notificación móvil**." \
            --assignee "$GITHUB_REPOSITORY_OWNER"
